[project]
name = "arcade-decision-agent"
version = "0.1.0"
description = "Play browser arcade games with typed-decision models: local Laya for reflexes, Jev and OpenAI Decisions for supervision"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "fuleinist" }]
keywords = ["laya", "jev", "decisions-api", "arcade", "agent", "emulator", "mame"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment :: Arcade",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pillow>=10.0",
  "playwright>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arcade-eval = "agent.eval:main"
arcade-serve = "agent.server:main"

[project.urls]
Repository = "https://github.com/fuleinist/arcade-decision-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "net: test needs the live third-party site or a network round trip",
]